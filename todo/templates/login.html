<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>


    <!-- Inter Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: "Inter", sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: #141116;

            color: #f4ede4;
        }


        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container {

            width: 100%;

            max-width: 410px;
        }


        /* =========================
           HEADER
        ========================= */

        .heading {

            margin-bottom: 28px;

            text-align: center;
        }


        h1 {

            font-size: 36px;

            font-weight: 650;

            letter-spacing: -1.2px;

            line-height: 1.15;

            margin-bottom: 10px;


            background: linear-gradient(
                90deg,
                #f4ede4,
                #c89aca
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        h2 {

            font-size: 14px;

            font-weight: 400;

            line-height: 1.6;

            letter-spacing: 0.1px;

            color: #9f929f;
        }


        /* =========================
           FORM CARD
        ========================= */

        form {

            width: 100%;

            padding: 32px;

            display: flex;

            flex-direction: column;


            background: rgba(255, 255, 255, 0.055);

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 16px;


            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);


            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           FIELD
        ========================= */

        .field {

            display: flex;

            flex-direction: column;
        }


        .field + .field {

            margin-top: 18px;
        }


        /* =========================
           LABEL
        ========================= */

        label {

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 500;

            color: #d5c9d3;
        }


        /* =========================
           INPUT
        ========================= */

        .inp {

            width: 100%;

            height: 50px;

            padding: 0 15px;


            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 11px;

            outline: none;


            background: rgba(255, 255, 255, 0.045);

            color: #f4ede4;


            font-size: 15px;

            font-weight: 400;


            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =========================
           PLACEHOLDER
        ========================= */

        .inp::placeholder {

            color: #746c75;
        }


        /* =========================
           INPUT FOCUS
        ========================= */

        .inp:focus {

            border-color: #9c619f;

            background: rgba(255, 255, 255, 0.07);


            box-shadow:
                0 0 0 3px rgba(156, 97, 159, 0.12);
        }


        /* =========================
           REQUIRED FIELD ERROR
        ========================= */

        .inp:invalid:not(:placeholder-shown) {

            border-color: rgba(210, 120, 120, 0.6);
        }


        /* =========================
           BUTTON
        ========================= */

        button {

            width: 100%;

            height: 50px;

            margin-top: 24px;


            border: none;

            border-radius: 11px;


            background: #8c528f;

            color: #ffffff;


            font-size: 15px;

            font-weight: 600;


            cursor: pointer;


            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =========================
           BUTTON HOVER
        ========================= */

        button:hover {

            background: #9b609e;

            transform: translateY(-1px);


            box-shadow:
                0 8px 20px rgba(140, 82, 143, 0.25);
        }


        /* =========================
           BUTTON ACTIVE
        ========================= */

        button:active {

            transform: translateY(0);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 18px;
            }


            .heading {

                margin-bottom: 24px;
            }


            h1 {

                font-size: 30px;
            }


            h2 {

                font-size: 14px;
            }


            form {

                padding: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="heading">

            <h1>
                Welcome back
            </h1>

            <h2>
                Let's continue from where we left off.
            </h2>

        </div>


        <!-- =========================
             LOGIN FORM
        ========================= -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="inp"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="inp"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Login Button -->

            <button type="submit">
                Continue →
            </button>


        </form>

    </div>


</body>

</html>
