<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Task</title>


    <!-- Inter Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: "Inter", sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: #141116;

            color: #f4ede4;
        }


        /* =========================
           CONTAINER
        ========================= */

        .update-container {

            width: 100%;

            max-width: 430px;
        }


        /* =========================
           HEADER
        ========================= */

        .heading {

            margin-bottom: 28px;

            text-align: center;
        }


        h1 {

            font-size: 34px;

            font-weight: 650;

            letter-spacing: -1.1px;

            line-height: 1.15;

            margin-bottom: 10px;


            background: linear-gradient(
                90deg,
                #f4ede4,
                #c89aca
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .subtitle {

            font-size: 14px;

            font-weight: 400;

            line-height: 1.6;

            color: #9f929f;
        }


        /* =========================
           FORM CARD
        ========================= */

        form {

            width: 100%;

            padding: 30px;

            display: flex;

            flex-direction: column;


            background: rgba(255,255,255,0.055);

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 16px;


            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);


            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }


        /* =========================
           LABEL
        ========================= */

        label {

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 500;

            color: #d5c9d3;
        }


        /* =========================
           INPUT
        ========================= */

        .task-input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 11px;

            outline: none;

            background: rgba(255,255,255,0.045);

            color: #f4ede4;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .task-input:focus {

            border-color: #9c619f;

            background: rgba(255,255,255,0.07);

            box-shadow:
                0 0 0 3px rgba(156,97,159,0.12);
        }


        /* =========================
           BUTTON
        ========================= */

        .update-btn {

            width: 100%;

            height: 50px;

            margin-top: 22px;

            border: none;

            border-radius: 11px;

            background: #8c528f;

            color: #ffffff;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;


            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .update-btn:hover {

            background: #9b609e;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(140,82,143,0.25);
        }


        .update-btn:active {

            transform: translateY(0);
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: #9f929f;

            font-size: 13px;

            font-weight: 500;

            text-decoration: none;

            transition: color 0.2s ease;
        }


        .back-link:hover {

            color: #c89aca;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 18px;
            }


            h1 {

                font-size: 30px;
            }


            form {

                padding: 24px;
            }

        }

    </style>

</head>


<body>


<div class="update-container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="heading">

        <h1>
            Update Task
        </h1>

        <p class="subtitle">
            Make a change and keep moving forward.
        </p>

    </div>


    <!-- =========================
         UPDATE FORM
    ========================= -->

    <form method="POST">

        {% csrf_token %}


        <label for="title">
            Task
        </label>


        <input
            type="text"
            id="title"
            name="title"
            value="{{ todo.title }}"
            class="task-input"
            autocomplete="off"
        >


        <button
            type="submit"
            class="update-btn"
        >
            Save changes →
        </button>

    </form>


    <!-- =========================
         BACK
    ========================= -->

    <a
        href="{% url 'todo' %}"
        class="back-link"
    >
        ← Back to To-Do List
    </a>


</div>


</body>

</html>
